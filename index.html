<style>
  :root { --sky: #fbe7d6; --ink: #3b2c36; --soft: #7d6873; --panel: #fffaf4; --edge: #f1d6c1; --mint: #6fc7b1; --mint-deep: #4aa38d; --coral: #ef8466; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; background: var(--sky); color: var(--ink); font-family: 'Nunito', ui-rounded, system-ui, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .card { width: min(360px, 100%); background: var(--panel); border: 2px solid var(--edge); border-radius: 22px; box-shadow: 0 4px 0 var(--edge); padding: 26px 22px 20px; text-align: center; }
  svg { width: 96px; height: 96px; }
  h1 { margin: 6px 0 2px; font: 800 32px/1.05 'Baloo 2', 'Nunito', sans-serif; }
  p { margin: 0 0 18px; color: var(--soft); font-weight: 600; }
  form { display: grid; gap: 10px; }
  input[type=password] { width: 100%; font: 800 18px 'Nunito', sans-serif; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--edge); background: #fff; color: var(--ink); text-align: center; }
  input[type=password]:focus-visible { outline: 3px solid var(--mint); outline-offset: 1px; }
  label.rem { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--soft); }
  button { font: 800 19px 'Baloo 2', 'Nunito', sans-serif; border: 0; border-radius: 14px; padding: 11px 16px; cursor: pointer; background: var(--mint); color: #fff; box-shadow: 0 3px 0 var(--mint-deep); }
  button:disabled { opacity: .7; cursor: wait; }
  button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .err { min-height: 1.3em; margin: 2px 0 0; color: #c2543b; font-weight: 800; }
  small { display: block; margin-top: 12px; color: var(--soft); font-weight: 600; }
</style>

const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const bu = (u8) => btoa(String.fromCharCode(...new Uint8Array(u8)));
const KEY = 'miyav-anahtar-' + P.salt;
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: ub(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openWith(key) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, key, ub(P.data));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
(async () => {
  if (!window.crypto || !crypto.subtle) { document.getElementById('err').textContent = 'Bu tarayıcı şifre çözmeyi desteklemiyor. Güncel Chrome veya Safari ile açın.'; return; }
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) {
    try { await openWith(await crypto.subtle.importKey('raw', ub(saved), 'AES-GCM', false, ['decrypt'])); return; }
    catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
  }
})();
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Açılıyor…'; err.textContent = '';
  try {
    const key = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) {
      const raw = await crypto.subtle.exportKey('raw', key);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(P.iv) }, key, ub(P.data));
      try { localStorage.setItem(KEY, bu(raw)); } catch (e2) {}
    }
    await openWith(key);
  } catch (e2) {
    btn.disabled = false; btn.textContent = 'Oyna'; err.textContent = 'Şifre yanlış, tekrar dene.';
  }
});
